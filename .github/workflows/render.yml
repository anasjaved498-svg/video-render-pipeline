name: Video Render Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_file:
        description: 'Selected MP3 audio file from assets/'
        required: false
        default: ''
      video_title:
        description: 'Text title overlay (and hashtags) for the video'
        required: false
        default: 'Default Title'
      text_color:
        description: 'Text overlay color (white, yellow, red, cyan, green)'
        required: false
        default: 'white'
      text_size:
        description: 'Text font size (36, 48, 64)'
        required: false
        default: '48'
      text_position:
        description: 'Text position (top, center, bottom)'
        required: false
        default: 'top'
  repository_dispatch:
    types: [trigger-render]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: Resolve Inputs & Setup Parameters
        run: |
          mkdir -p assets output

          AUDIO_NAME="${{ inputs.audio_file || github.event.client_payload.audio_file }}"

          if [ -z "$AUDIO_NAME" ]; then
            AUDIO_NAME=$(ls assets/*.mp3 2>/dev/null | head -n 1 | xargs -n 1 basename 2>/dev/null)
          fi

          TARGET_PATH="assets/${AUDIO_NAME}"

          if [ -z "$AUDIO_NAME" ] || [ ! -f "$TARGET_PATH" ] || ! ffprobe -i "$TARGET_PATH" >/dev/null 2>&1; then
            echo "No valid audio selected. Generating 10s fallback audio..."
            AUDIO_NAME="silent_fallback.mp3"
            TARGET_PATH="assets/silent_fallback.mp3"
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 10 -q:a 9 -acodec libmp3lame "$TARGET_PATH"
          else
            echo "Using background audio: $TARGET_PATH"
          fi

          TITLE_TEXT="${{ inputs.video_title || github.event.client_payload.title || 'Default Title' }}"
          VIDEO_URL="${{ github.event.client_payload.video_url || 'https://drive.google.com/uc?export=download&id=14hrdDQTfbR3ExgH2sg_ZOk17YrprQ84u' }}"
          COLOR="${{ inputs.text_color || github.event.client_payload.text_color || 'white' }}"
          SIZE="${{ inputs.text_size || github.event.client_payload.text_size || '48' }}"
          POSITION="${{ inputs.text_position || github.event.client_payload.text_position || 'top' }}"

          # Clean newlines and escape special characters for FFmpeg drawtext
          ESCAPED_TITLE=$(echo "$TITLE_TEXT" | tr '\n' ' ' | sed "s/'/\\\\'/g" | sed "s/:/\\\\:/g")

          if [ "$POSITION" = "center" ]; then
            Y_POS="(h-text_h)/2"
          elif [ "$POSITION" = "bottom" ]; then
            Y_POS="h-text_h-50"
          else
            Y_POS="50"
          fi

          # Safe multi-line string writing to GITHUB_ENV
          echo "SELECTED_AUDIO=${TARGET_PATH}" >> $GITHUB_ENV
          echo "SRC_URL=${VIDEO_URL}" >> $GITHUB_ENV
          echo "TEXT_COLOR=${COLOR}" >> $GITHUB_ENV
          echo "TEXT_SIZE=${SIZE}" >> $GITHUB_ENV
          echo "Y_POSITION=${Y_POS}" >> $GITHUB_ENV

          echo "VIDEO_TITLE<<EOF" >> $GITHUB_ENV
          echo "$ESCAPED_TITLE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download Video Source
        run: |
          echo "Downloading base video from Google Drive..."
          curl -L -o source.mp4 "$SRC_URL"

          if [ ! -s source.mp4 ]; then
            echo "Error: Downloaded video file is empty."
            exit 1
          fi

      - name: Render Video — Overlay Text & Mix Audio
        run: |
          HAS_AUDIO=$(ffprobe -i source.mp4 -show_streams -select_streams a -loglevel error | wc -l)
          FONT_PATH="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          if [ "$HAS_AUDIO" -gt 0 ]; then
            echo "Mixing base video audio with selected background music..."
            ffmpeg -y -i source.mp4 -i "$SELECTED_AUDIO" \
              -filter_complex "
                [0:v]drawtext=fontfile=${FONT_PATH}:text='${VIDEO_TITLE}':fontcolor=${TEXT_COLOR}:fontsize=${TEXT_SIZE}:
                  box=1:boxcolor=black@0.5:boxborderw=10:x=(w-text_w)/2:y=${Y_POSITION}[v];
                [0:a][1:a]amix=inputs=2:duration=first:weights='1 0.4'[a]
              " \
              -map "[v]" -map "[a]" -c:v libx264 -preset fast -c:a aac \
              -shortest output/rendered_video.mp4
          else
            echo "Video has no audio track. Setting background music as primary audio..."
            ffmpeg -y -i source.mp4 -i "$SELECTED_AUDIO" \
              -filter_complex "
                [0:v]drawtext=fontfile=${FONT_PATH}:text='${VIDEO_TITLE}':fontcolor=${TEXT_COLOR}:fontsize=${TEXT_SIZE}:
                  box=1:boxcolor=black@0.5:boxborderw=10:x=(w-text_w)/2:y=${Y_POSITION}[v]
              " \
              -map "[v]" -map 1:a -c:v libx264 -preset fast -c:a aac \
              -shortest output/rendered_video.mp4
          fi

      - name: Upload Output Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/rendered_video.mp4
          retention-days: 7
