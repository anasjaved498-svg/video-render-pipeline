name: Video Render Pipeline

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source Video URL'
        required: false
        default: ''
      title:
        description: 'Video Title'
        required: false
        default: 'Default Title'
      text_color:
        description: 'Text Color'
        required: false
        default: '#ffffff'
      font_style:
        description: 'Font Style'
        required: false
        default: 'Arial'
      hashtags:
        description: 'Hashtags'
        required: false
        default: ''
      audio_url:
        description: 'Audio URL'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl wget grep fontconfig python3-pip ttf-mscorefonts-installer
          sudo fc-cache -f -v

      - name: Download source video with gdown
        run: |
          URL="${{ github.event.client_payload.video_url || github.event.inputs.video_url }}"
          
          echo "Installing gdown..."
          pip install gdown --break-system-packages
          
          echo "Downloading video securely from Google Drive..."
          gdown "$URL" -O input_video.mp4
          
          ls -lh input_video.mp4
          file input_video.mp4

      - name: Process and Render Video with FFmpeg
        env:
          TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          TEXT_COLOR: ${{ github.event.client_payload.text_color || github.event.inputs.text_color }}
          FONT_STYLE: ${{ github.event.client_payload.font_style || github.event.inputs.font_style }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url || github.event.inputs.audio_url }}
        run: |
          # Map font styles safely to installed font files
          FONT_FILE="/usr/share/fonts/truetype/msttcorefonts/Arial.ttf"
          if [ "$FONT_STYLE" = "Impact" ]; then
            FONT_FILE="/usr/share/fonts/truetype/msttcorefonts/Impact.ttf"
          elif [ "$FONT_STYLE" = "Verdana" ]; then
            FONT_FILE="/usr/share/fonts/truetype/msttcorefonts/Verdana.ttf"
          elif [ "$FONT_STYLE" = "Courier" ]; then
            FONT_FILE="/usr/share/fonts/truetype/msttcorefonts/Courier_New.ttf"
          fi

          echo "Using font file: $FONT_FILE"
          echo "Using text color: $TEXT_COLOR"
          echo "Using title text: $TITLE"

          if [ -n "$AUDIO_URL" ]; then
            echo "Downloading background music..."
            curl -L "$AUDIO_URL" -o background_audio.mp3
            
            echo "Rendering video with custom text, font, color, and background music..."
            ffmpeg -i input_video.mp4 -i background_audio.mp3 \
              -filter_complex "[0:v]drawtext=text='$TITLE':fontfile=$FONT_FILE:fontcolor=$TEXT_COLOR:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
              -map "[v]" -map "1:a" -shortest -c:v libx264 -preset fast -c:a aac output_rendered.mp4
          else
            echo "Rendering video with custom text, font, and color only..."
            ffmpeg -i input_video.mp4 \
              -vf "drawtext=text='$TITLE':fontfile=$FONT_FILE:fontcolor=$TEXT_COLOR:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2" \
              -c:v libx264 -preset fast -c:a copy output_rendered.mp4
          fi

      - name: Create Release and Upload Video Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          name: "Rendered Video Run #${{ github.run_number }}"
          files: output_rendered.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Completion Webhook to n8n
        if: always()
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/run-${{ github.run_number }}/output_rendered.mp4"
          curl -X POST "https://n8n.wadwarehouse.com/webhook/623fd7bf-6f5b-4480-a37d-f047f9255405" \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: MySecretKey_2026_xyz789" \
          -d "{
            \"status\": \"success\",
            \"rendered_video_url\": \"$DIRECT_URL\",
            \"title\": \"${{ github.event.client_payload.title || github.event.inputs.title }}\",
            \"hashtags\": \"${{ github.event.client_payload.hashtags || github.event.inputs.hashtags }}\",
            \"source_url\": \"${{ github.event.client_payload.video_url || github.event.inputs.video_url }}\"
          }"
