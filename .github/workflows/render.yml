name: Video Render Pipeline

on:
  repository_dispatch:
    types: [trigger-render]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source Video URL'
        required: false
        default: ''
      title:
        description: 'Video Title'
        required: false
        default: 'Default Title'
      text_color:
        description: 'Text Color'
        required: false
        default: '#ffffff'
      font_style:
        description: 'Font Style'
        required: false
        default: 'Arial'
      hashtags:
        description: 'Hashtags'
        required: false
        default: ''
      audio_url:
        description: 'Audio URL'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl grep fontconfig

      - name: Process and Render Video with FFmpeg
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          TEXT_COLOR: ${{ github.event.client_payload.text_color || github.event.inputs.text_color }}
          FONT_STYLE: ${{ github.event.client_payload.font_style || github.event.inputs.font_style }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url || github.event.inputs.audio_url }}
        run: |
          echo "Downloading source video..."
          curl -c ./cookie -s -L "$VIDEO_URL" -o input_video.mp4
          
          if grep -q "html" input_video.mp4 || grep -q "Virus scan warning" input_video.mp4; then
            echo "Large file warning detected. Extracting File ID and bypassing..."
            FILE_ID=$(echo "$VIDEO_URL" | grep -oP 'id=\K[^&]+')
            curl -Lb ./cookie "https://drive.google.com/uc?export=download&confirm=t&id=$FILE_ID" -o input_video.mp4
          fi

          # Map specific standard font names safely
          FONT_NAME="Sans"
          if [ "$FONT_STYLE" = "Impact" ]; then FONT_NAME="Impact"; fi
          if [ "$FONT_STYLE" = "Verdana" ]; then FONT_NAME="Verdana"; fi
          if [ "$FONT_STYLE" = "Courier" ]; then FONT_NAME="Courier"; fi

          if [ -n "$AUDIO_URL" ]; then
            echo "Downloading background music..."
            curl -L "$AUDIO_URL" -o background_audio.mp3
            
            echo "Rendering video with text overlay and background music..."
            ffmpeg -i input_video.mp4 -i background_audio.mp3 \
              -filter_complex "[0:v]drawtext=text='$TITLE':fontfile=/usr/share/fonts/truetype/msttcorefonts/Arial.ttf:fontcolor=$TEXT_COLOR:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
              -map "[v]" -map "1:a" -shortest -c:v libx264 -preset fast -c:a aac output_rendered.mp4
          else
            echo "Rendering video with text overlay only..."
            ffmpeg -i input_video.mp4 \
              -vf "drawtext=text='$TITLE':fontcolor=$TEXT_COLOR:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2" \
              -c:v libx264 -preset fast -c:a copy output_rendered.mp4
          fi

      - name: Create Release and Upload Video Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          name: "Rendered Video Run #${{ github.run_number }}"
          files: output_rendered.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Completion Webhook to n8n
        if: always()
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/run-${{ github.run_number }}/output_rendered.mp4"
          curl -X POST "https://n8n.wadwarehouse.com/webhook/623fd7bf-6f5b-4480-a37d-f047f9255405" \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: MySecretKey_2026_xyz789" \
          -d "{
            \"status\": \"success\",
            \"rendered_video_url\": \"$DIRECT_URL\",
            \"title\": \"${{ github.event.client_payload.title || github.event.inputs.title }}\",
            \"hashtags\": \"${{ github.event.client_payload.hashtags || github.event.inputs.hashtags }}\",
            \"source_url\": \"${{ github.event.client_payload.video_url || github.event.inputs.video_url }}\"
          }"
