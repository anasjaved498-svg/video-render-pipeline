name: Video Render Pipeline

on:
  repository_dispatch:
    types: [trigger-render]

jobs:
  render-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Source Video & Audio Track
        run: |
          curl -L "${{ github.event.client_payload.video_url }}" -o input_video.mp4
          
          AUDIO_URL="${{ github.event.client_payload.audio_url }}"
          if [ -n "$AUDIO_URL" ]; then
            curl -L "$AUDIO_URL" -o background_music.mp3
            HAS_AUDIO=true
          else
            HAS_AUDIO=false
          fi
          echo "HAS_AUDIO=$HAS_AUDIO" >> $GITHUB_ENV

      - name: Process Video with FFmpeg & Custom Styling
        run: |
          TITLE="${{ github.event.client_payload.title }}"
          if [ -z "$TITLE" ]; then TITLE="Rendered Video"; fi
          
          COLOR="${{ github.event.client_payload.text_color }}"
          if [ -z "$COLOR" ]; then COLOR="#ffffff"; fi
          # Convert hex color code to FFmpeg format if needed, default white
          
          FONT_STYLE="${{ github.event.client_payload.font_style }}"
          
          # Check if background audio was selected and merge tracks
          if [ "$HAS_AUDIO" = "true" ]; then
            ffmpeg -i input_video.mp4 -i background_music.mp3 \
              -filter_complex "[0:v]drawtext=text='$TITLE':fontcolor=$COLOR:fontsize=28:box=1:boxcolor=black@0.6:boxborderw=6:x=(w-text_w)/2:y=h-th-30[v];[0:a]volume=0.2[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first[a]" \
              -map "[v]" -map "[a]" -c:v libx264 -c:a aac output_video.mp4
          else
            ffmpeg -i input_video.mp4 \
              -vf "drawtext=text='$TITLE':fontcolor=$COLOR:fontsize=28:box=1:boxcolor=black@0.6:boxborderw=6:x=(w-text_w)/2:y=h-th-30" \
              -codec:a copy output_video.mp4
          fi

      - name: Create GitHub Release & Upload Asset
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: render-${{ github.run_number }}
          files: output_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger n8n Webhook Completion
        run: |
          RENDERED_URL="https://github.com/${{ github.repository }}/releases/download/render-${{ github.run_number }}/output_video.mp4"
          
          curl -X POST "${{ secrets.N8N_COMPLETION_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: MySecretKey_2026_xyz789" \
            -d "{
              \"status\": \"success\",
              \"rendered_video_url\": \"$RENDERED_URL\",
              \"title\": \"${{ github.event.client_payload.title }}\",
              \"hashtags\": \"${{ github.event.client_payload.hashtags }}\",
              \"source_url\": \"${{ github.event.client_payload.video_url }}\"
            }"
