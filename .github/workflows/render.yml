name: Render Video
on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:
    inputs:
      audio_file:
        description: 'Selected background audio filename from assets/'
        required: false
      video_title:
        description: 'Text overlay title'
        required: false
        default: 'Sample Title'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure ffmpeg is present
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Resolve Inputs
        run: |
          AUDIO_NAME="${{ inputs.audio_file || github.event.client_payload.audio_file }}"
          
          # If no audio file specified, fallback to first mp3 in assets/
          if [ -z "$AUDIO_NAME" ]; then
            AUDIO_NAME=$(ls assets/*.mp3 2>/dev/null | head -n 1 | xargs -n 1 basename)
          fi

          mkdir -p assets

          # If target audio file still does not exist, generate fallback silent audio
          if [ -z "$AUDIO_NAME" ] || [ ! -f "assets/${AUDIO_NAME}" ]; then
            AUDIO_NAME="silent_fallback.mp3"
            if [ ! -f "assets/silent_fallback.mp3" ]; then
              ffmpeg -f lavfi -i anullsrc=r=44100:cl=stereo -t 10 -q:a 9 -acodec libmp3lame assets/silent_fallback.mp3
            fi
          fi

          TITLE_TEXT="${{ inputs.video_title || github.event.client_payload.title || 'Default Title' }}"
          VIDEO_URL="${{ github.event.client_payload.video_url || 'https://drive.google.com/uc?export=download&id=14hrdDQTfbR3ExgH2sg_ZOk17YrprQ84u' }}"

          echo "SELECTED_AUDIO=assets/${AUDIO_NAME}" >> $GITHUB_ENV
          echo "VIDEO_TITLE=${TITLE_TEXT}" >> $GITHUB_ENV
          echo "SRC_URL=${VIDEO_URL}" >> $GITHUB_ENV

      - name: Download source video from Google Drive
        run: |
          FILE_ID=$(echo "$SRC_URL" | grep -o 'id=[^&]*' | cut -d= -f2)
          if [ -z "$FILE_ID" ]; then
            FILE_ID=$(echo "$SRC_URL" | sed -n 's/.*\/d\/\([^\/]*\).*/\1/p')
          fi
          curl -L -c /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=${FILE_ID}" > /tmp/confirm.html
          CONFIRM=$(grep -o 'confirm=[^&"]*' /tmp/confirm.html | head -n 1 | cut -d= -f2)
          curl -L -b /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o source.mp4

      - name: Render — overlay title + mix background music
        run: |
          HAS_AUDIO=$(ffprobe -i source.mp4 -show_streams -select_streams a -loglevel error | wc -l)

          if [ "$HAS_AUDIO" -gt 0 ]; then
            echo "Source video has audio — mixing with $SELECTED_AUDIO"
            ffmpeg -i source.mp4 -i "$SELECTED_AUDIO" \
              -filter_complex "
                [0:v]drawtext=text='${VIDEO_TITLE}':fontcolor=white:fontsize=48:
                  box=1:boxcolor=black@0.5:boxborderw=10:x=(w-text_w)/2:y=50:
                  enable='between(t,0,4)'[v];
                [0:a][1:a]amix=inputs=2:duration=first:weights='1 0.4'[a]
              " \
              -map "[v]" -map "[a]" -c:v libx264 -preset fast -c:a aac \
              -shortest output.mp4
          else
            echo "Source video is silent — using $SELECTED_AUDIO as audio"
            ffmpeg -i source.mp4 -i "$SELECTED_AUDIO" \
              -filter_complex "
                [0:v]drawtext=text='${VIDEO_TITLE}':fontcolor=white:fontsize=48:
                  box=1:boxcolor=black@0.5:boxborderw=10:x=(w-text_w)/2:y=50:
                  enable='between(t,0,4)'[v]
              " \
              -map "[v]" -map 1:a -c:v libx264 -preset fast -c:a aac \
              -shortest output.mp4
          fi

      - name: Upload rendered video as a Release asset
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.run_id }}
          files: output.mp4
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Callback to n8n with the public video URL
        run: |
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/render-${{ github.run_id }}/output.mp4"
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"video_url\": \"${ASSET_URL}\", \"title\": \"${VIDEO_TITLE}\"}"
